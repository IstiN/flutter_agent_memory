# crap4dart configuration for flutter_agent_memory.
# Pure Dart package; Flutter-specific gates are disabled.
#
# Target CRAP threshold for the framework. Methods above this line are flagged
# in CI; the badge reflects the current max CRAP score.
sources: [lib, bin, test]
exclude:
  # Integration tests are excluded from CI test runs (they hit real/external
  # LLM endpoints), so they are also excluded from the CRAP ratchet.
  - 'test/integration/**'

crap:
  enabled: true
  threshold: 8.0

coverage:
  lcov_path: coverage/lcov.info
  run_tests: false
  required: true
  branch_coverage: true

gates:
  loc:
    enabled: true
    max_lines: 900
    exclude:
      - '**.g.dart'
      - '**.freezed.dart'
      - '**.mocks.dart'
  test_coverage:
    enabled: true
    min_percent: 60.0
    per_file: false
  golden:
    enabled: false
  hardcoded_strings:
    enabled: false
  accessibility:
    enabled: false
  complexity:
    enabled: true
    max_complexity: 40
  method_size:
    enabled: true
    max_lines: 400
    max_params: 20
  public_docs:
    enabled: false
    exclude:
      - 'test/**'
